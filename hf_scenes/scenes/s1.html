<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0B1220;font-family:Inter,sans-serif;color:#fff}
#root{position:relative;width:1920px;height:1080px}canvas{position:absolute;inset:0;width:1920px;height:1080px}
.t{position:absolute;left:0;width:1920px;text-align:center;opacity:0}
.h1{font-size:78px;font-weight:800;letter-spacing:-.02em}.h2{font-size:38px;font-weight:400;color:#b6c4d6}
.teal{color:#14B8A6}.amber{color:#F59E0B}
.lbl{position:absolute;transform:translate(-50%,0);font-size:30px;font-weight:600;padding:8px 18px;border-radius:8px;background:rgba(11,18,32,.8);border:1px solid rgba(20,184,166,.5);opacity:0;white-space:nowrap}
</style></head><body>
<div id="root" data-composition-id="s1" data-start="0" data-duration="21.1" data-width="1920" data-height="1080">
<canvas id="c" class="clip" data-start="0" data-duration="21.1" data-track-index="0"></canvas>
<div id="a1" class="t h1 clip" style="top:760px" data-start="0" data-duration="21.1" data-track-index="1">Vidhur <span class="teal">&ndash;</span> An AI auditor for cost decisions</div>
<div id="a2" class="t h2 clip" style="top:870px" data-start="0" data-duration="21.1" data-track-index="2">Zetaris Demo Challenge &nbsp;|&nbsp; Team Vidhur</div>
<div id="b1" class="t h1 clip" style="top:120px" data-start="0" data-duration="21.1" data-track-index="3">AI tools can <span class="amber">make up numbers</span></div>
<div id="b2" class="t h2 clip" style="top:230px" data-start="0" data-duration="21.1" data-track-index="4">In finance, one wrong number costs real money</div>
<div id="c1" class="t h1 clip" style="top:120px" data-start="0" data-duration="21.1" data-track-index="5">This is <span class="teal">Vidhur</span></div>
<div id="c2" class="t h2 clip" style="top:230px" data-start="0" data-duration="21.1" data-track-index="6">An AI auditor for cost decisions &middot; built for Ganga AI Solutions, a GPU company</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
const IN={opacity:1,y:0,duration:.8,ease:"power3.out"};
tl.fromTo("#a1",{opacity:0,y:30},IN,.5).fromTo("#a2",{opacity:0,y:20},IN,1.0).to(["#a1","#a2"],{opacity:0,duration:.5},3.6)
  .fromTo("#b1",{opacity:0,y:30},IN,4.1).fromTo("#b2",{opacity:0,y:20},IN,4.6).to(["#b1","#b2"],{opacity:0,duration:.5},11.1)
  .fromTo("#c1",{opacity:0,y:30},IN,11.7).fromTo("#c2",{opacity:0,y:20},IN,12.3).to(["#c1","#c2"],{opacity:0,duration:.6},20.4);
window.__timelines=window.__timelines||{};window.__timelines["s1"]=tl;tl.seek(0);
</script>
<script type="module">
import {THREE,setup,zetarisCylinder,animateCylinder,textPlane,shield,ease,clamp01,AMBER} from "./scenes/z3d.js";
const {renderer,scene,camera}=setup(document.getElementById("c"));
const cyl=zetarisCylinder();scene.add(cyl);
const q=[];for(let i=0;i<6;i++){const p=textPlane(["£?","$?","€?","£4.2m?","£?","$9m?"][i],1.6,{color:"#F59E0B",size:130});scene.add(p);q.push(p);}
const sh=shield();sh.scale.setScalar(.8);scene.add(sh);
function R(t){
  animateCylinder(cyl,t);
  // title: camera orbits close; then pulls back
  const k=ease(t/4);
  camera.position.set(Math.sin(t*.08)*1.2, .6+1.2*(1-k)*0, 9.2-0.9*k+(t>4?0.5*ease((t-4)/2):0));
  camera.lookAt(0, t<4?.5*(1-k)-.3:-.1, 0);
  cyl.position.y = t<4? .35 : .35-0.55*ease((t-4)/1.5);
  // floating made-up numbers during line 01
  q.forEach((p,i)=>{const on=clamp01((t-4.4-i*.35)/.8)*(1-clamp01((t-10.8)/.6));
    const a=i/6*Math.PI*2+t*.25; p.position.set(Math.cos(a)*2.8, -.2+Math.sin(t*.9+i)*.35, Math.sin(a)*1.6-.5);
    p.material.opacity=on; p.lookAt(camera.position);});
  // shield arrives with Vidhur (line 02)
  const s=ease((t-12)/1.4); sh.visible=t>11.9; sh.position.set(2.5-0.2*s, -.1+Math.sin(t)*.06, 1.2*s-1); sh.rotation.y=-0.5+0.5*s+Math.sin(t*.6)*.15;
  sh.scale.setScalar(.55*s+.001);
  renderer.render(scene,camera);
}
addEventListener("hf-seek",e=>R(e.detail.time));R(window.__hfThreeTime||0);
</script></body></html>
